<svg fill="none" viewBox="0 0 800 300" width="800" height="300" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: radial-gradient(circle at 10% 20%, rgba(15, 23, 42, 1) 0%, rgba(9, 13, 26, 1) 90%);
          width: 800px;
          height: 300px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          position: relative;
          overflow: hidden;
          border-radius: 12px;
          border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Abstract glowing blobs */
        .glow-1 {
          position: absolute;
          width: 300px;
          height: 300px;
          background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(99, 102, 241, 0) 70%);
          top: -100px;
          left: -50px;
          animation: float 8s ease-in-out infinite;
        }

        .glow-2 {
          position: absolute;
          width: 350px;
          height: 350px;
          background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0) 70%);
          bottom: -150px;
          right: -50px;
          animation: float 10s ease-in-out infinite reverse;
        }

        @keyframes float {
          0%, 100% { transform: translateY(0px) scale(1); }
          50% { transform: translateY(15px) scale(1.05); }
        }

        /* Tech Grid Lines */
        .grid {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-image: 
            linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
          background-size: 40px 40px;
          opacity: 0.8;
        }

        /* Text Styling */
        .badge {
          background: rgba(99, 102, 241, 0.1);
          border: 1px solid rgba(99, 102, 241, 0.3);
          color: #818cf8;
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 0.8rem;
          font-weight: 600;
          letter-spacing: 0.15em;
          text-transform: uppercase;
          margin-bottom: 16px;
          z-index: 1;
          box-shadow: 0 0 15px rgba(99, 102, 241, 0.1);
          animation: pulse 2s infinite;
        }

        .name {
          font-size: 3.2rem;
          font-weight: 800;
          letter-spacing: -0.02em;
          margin: 0;
          z-index: 1;
          background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          text-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
          font-size: 1.15rem;
          color: #94a3b8;
          margin-top: 12px;
          margin-bottom: 0;
          font-weight: 400;
          letter-spacing: 0.05em;
          z-index: 1;
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .sparkle {
          color: #38bdf8;
          font-weight: bold;
        }

        @keyframes pulse {
          0%, 100% { box-shadow: 0 0 15px rgba(99, 102, 241, 0.1); }
          50% { box-shadow: 0 0 25px rgba(99, 102, 241, 0.25); border-color: rgba(99, 102, 241, 0.5); }
        }
      </style>
      <div class="container">
        <div class="grid"></div>
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="badge">Artificial Intelligence &amp; Data Science</div>
        <h1 class="name">YUVAN SHANKAR S</h1>
        <p class="subtitle">
          <span class="sparkle">✦</span> Crafting intelligent solutions with data and code <span class="sparkle">✦</span>
        </p>
      </div>
    </div>
  </foreignObject>
</svg>
